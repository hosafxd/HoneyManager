worker_processes 1;
error_log /var/log/honeypot/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON access log for honeypot analysis
    log_format honeypot_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_body":"$request_body",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"server_addr":"$server_addr",'
        '"server_port":"$server_port"'
    '}';

    access_log /var/log/honeypot/access.json honeypot_json;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html index.php;

        # Capture POST body for credential logging
        client_body_buffer_size 10K;
        client_max_body_size 8m;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Fake RTSP endpoint (returns 404 but logs attempt)
        location /ISAPI/ {
            return 404;
        }
    }
}
